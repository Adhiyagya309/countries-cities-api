openapi: 3.0.3
info:
  title: Countries and Cities API
  description: REST API for retrieving countries, paginated cities by country, and city details.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /countries:
    get:
      summary: Get all countries
      description: Returns the list of available countries.
      operationId: getCountries
      tags:
        - Countries
      responses:
        '200':
          description: List of countries retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'

  /countries/{countryId}/cities:
    get:
      summary: Get cities by country
      description: Returns a paginated list of cities belonging to the selected country.
      operationId: getCitiesByCountry
      tags:
        - Cities
      parameters:
        - name: countryId
          in: path
          required: true
          description: Unique identifier of the country
          schema:
            type: integer
            format: int64
            example: 1
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
            example: 10
      responses:
        '200':
          description: Paginated cities for the specified country
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCityResponse'
        '400':
          description: Invalid query or path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Country not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cities/{cityId}:
    get:
      summary: Get city details by ID
      description: Returns detailed information for a specific city.
      operationId: getCityById
      tags:
        - Cities
      parameters:
        - name: cityId
          in: path
          required: true
          description: Unique identifier of the city
          schema:
            type: integer
            format: int64
            example: 101
      responses:
        '200':
          description: City details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '404':
          description: City not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Country:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: India

    City:
      type: object
      required:
        - id
        - name
        - countryId
      properties:
        id:
          type: integer
          format: int64
          example: 101
        name:
          type: string
          example: Bengaluru
        countryId:
          type: integer
          format: int64
          example: 1
        population:
          type: integer
          format: int64
          example: 13600000
        region:
          type: string
          example: Karnataka
        timezone:
          type: string
          example: Asia/Kolkata

    PagedCityResponse:
      type: object
      required:
        - items
        - totalRecords
        - currentPage
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
        totalRecords:
          type: integer
          format: int64
          example: 12
        currentPage:
          type: integer
          format: int32
          example: 0
        pageSize:
          type: integer
          format: int32
          example: 10
        totalPages:
          type: integer
          format: int32
          example: 2

    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: 2026-11-20T15:46:00Z
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Country not found with id 999
